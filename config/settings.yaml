### GraphRAG settings. See https://microsoft.github.io/graphrag/config/yaml/
###
### Backend switch: set LLM_BACKEND=ollama or LLM_BACKEND=vllm in the repo-root .env.
### make index LLM_BACKEND=vllm   also works for a single command.
### The pipeline exports GRAPHRAG_COMPLETION_MODEL_ID and GRAPHRAG_EMBEDDING_MODEL_ID
### from that choice. Both profiles below stay in this file.

### LLM settings ###

completion_models:
  ollama: # local dev
    model_provider: openai
    model: medgemma-graphrag:4b
    auth_method: api_key
    api_key: ${GRAPHRAG_API_KEY}
    api_base: http://localhost:11434/v1
    call_args:
      timeout: 300
    retry:
      type: exponential_backoff
      max_retries: 2
  vllm: # RunPod / production
    model_provider: openai
    model: google/medgemma-4b-it
    auth_method: api_key
    api_key: ${GRAPHRAG_API_KEY}
    api_base: http://127.0.0.1:8000/v1
    call_args:
      timeout: 300
    retry:
      type: exponential_backoff
      max_retries: 2

embedding_models:
  ollama:
    model_provider: openai
    model: nomic-embed-text
    auth_method: api_key
    api_key: ${GRAPHRAG_API_KEY}
    api_base: http://localhost:11434/v1
    retry:
      type: exponential_backoff
  vllm:
    model_provider: openai
    model: nomic-ai/nomic-embed-text-v1.5
    auth_method: api_key
    api_key: ${GRAPHRAG_API_KEY}
    api_base: http://127.0.0.1:8001/v1
    retry:
      type: exponential_backoff

# One request at a time. Raise this on a larger vLLM GPU if indexing is too slow.
concurrent_requests: 1
async_mode: threaded

### Document processing settings ###

input:
  type: text # [csv, text, json, jsonl]

chunking:
  type: tokens
  size: 600
  overlap: 50
  encoding_model: o200k_base

### Storage settings ###
## If blob storage is specified in the following four sections,
## connection_string and container_name must be provided

input_storage:
  type: file # [file, blob, cosmosdb]
  base_dir: "../data/input"

output_storage:
  type: file # [file, blob, cosmosdb]
  base_dir: "../data/output"

reporting:
  type: file # [file, blob]
  base_dir: "../data/logs"

cache:
  type: json # [json, memory, sqlite, none]
  storage:
    type: file # [file, blob, cosmosdb]
    base_dir: "../data/cache"
  # database_name: "cache.db" # Only used when type is sqlite
    
vector_store:
  type: lancedb
  db_uri: ../data/output/lancedb

### Workflow settings ###

embed_text:
  embedding_model_id: ${GRAPHRAG_EMBEDDING_MODEL_ID}

extract_graph:
  completion_model_id: ${GRAPHRAG_COMPLETION_MODEL_ID}
  prompt: "../data/prompts/extract_graph.txt"
  entity_types: [organization,person,geo,event]
  max_gleanings: 1

summarize_descriptions:
  completion_model_id: ${GRAPHRAG_COMPLETION_MODEL_ID}
  prompt: "../data/prompts/summarize_descriptions.txt"
  max_length: 500

extract_graph_nlp:
  text_analyzer:
    extractor_type: regex_english # [regex_english, syntactic_parser, cfg]

cluster_graph:
  max_cluster_size: 10

extract_claims:
  enabled: false
  completion_model_id: ${GRAPHRAG_COMPLETION_MODEL_ID}
  prompt: "../data/prompts/extract_claims.txt"
  description: "Any claims or facts that could be relevant to information discovery."
  max_gleanings: 1

community_reports:
  completion_model_id: ${GRAPHRAG_COMPLETION_MODEL_ID}
  graph_prompt: "../data/prompts/community_report_graph.txt"
  text_prompt: "../data/prompts/community_report_text.txt"
  max_length: 2000
  max_input_length: 8000

snapshots:
  graphml: false
  embeddings: false

### Query settings ###
## The prompt locations are required here, but each search method has a number of optional knobs that can be tuned.
## See the config docs: https://microsoft.github.io/graphrag/config/yaml/#query

local_search:
  completion_model_id: ${GRAPHRAG_COMPLETION_MODEL_ID}
  embedding_model_id: ${GRAPHRAG_EMBEDDING_MODEL_ID}
  prompt: "../data/prompts/local_search_system_prompt.txt"

global_search:
  completion_model_id: ${GRAPHRAG_COMPLETION_MODEL_ID}
  map_prompt: "../data/prompts/global_search_map_system_prompt.txt"
  reduce_prompt: "../data/prompts/global_search_reduce_system_prompt.txt"
  knowledge_prompt: "../data/prompts/global_search_knowledge_system_prompt.txt"

drift_search:
  completion_model_id: ${GRAPHRAG_COMPLETION_MODEL_ID}
  embedding_model_id: ${GRAPHRAG_EMBEDDING_MODEL_ID}
  prompt: "../data/prompts/drift_search_system_prompt.txt"
  reduce_prompt: "../data/prompts/drift_search_reduce_prompt.txt"

basic_search:
  completion_model_id: ${GRAPHRAG_COMPLETION_MODEL_ID}
  embedding_model_id: ${GRAPHRAG_EMBEDDING_MODEL_ID}
  prompt: "../data/prompts/basic_search_system_prompt.txt"
